name: Tests and Coverage

on:
  workflow_call:
  pull_request:
  push:
    branches: [codex/backport-v1.0.8]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-24.04
    timeout-minutes: 60
    steps:
      - name: Verify action runtime security
        id: node_security
        shell: bash
        # Keep in sync with base.yml. A local action would require checkout first.
        # Pinned actions must use node24 and have no runs.pre hook.
        run: |
          set -euo pipefail
          worker="$(readlink -f "/proc/$PPID/exe")"
          if [[ "$worker" != */bin/Runner.Worker ]]; then
            echo "::error::Cannot locate the active runner's embedded Node.js runtime."
            exit 1
          fi
          node="${worker%/bin/Runner.Worker}/externals/node24/bin/node"
          if [[ ! -x "$node" ]]; then
            echo "::error::The active runner has no executable Node.js 24 runtime."
            exit 1
          fi
          node_version_allowed() {
            [[ "$1" =~ ^v24\.([0-9]+)\.([0-9]+)$ ]] &&
              (( BASH_REMATCH[1] > 22 || (BASH_REMATCH[1] == 22 && BASH_REMATCH[2] >= 1) ))
          }
          version="$("$node" --version)"
          if ! node_version_allowed "$version"; then
            if [[ "${RUNNER_ENVIRONMENT:-}" != github-hosted ]]; then
              echo "::error::Update the self-hosted runner's embedded Node.js $version to Node.js 24.22.1 or newer on the 24.x line."
              exit 1
            fi
            # GitHub-hosted images can lag behind Node.js security releases.
            # These archive hashes come from the official v24.22.1 SHASUMS256.txt.
            case "${RUNNER_ARCH:-}" in
              X64)
                arch=x64
                checksum=eb6728e77c576a35162c122c45ccadf224d89ff00abc8dae46cc2897c6002d7c
                ;;
              ARM64)
                arch=arm64
                checksum=33c37be234ba8bee041961047b19160f4d7d0f164e8e246f78bdd10feff148b3
                ;;
              *)
                echo "::error::Unsupported runner architecture: ${RUNNER_ARCH:-unknown}."
                exit 1
                ;;
            esac
            echo "Updating the hosted runner's embedded Node.js $version to v24.22.1."
            bootstrap_dir="$(mktemp -d "${RUNNER_TEMP:?}/node-runtime.XXXXXX")"
            trap 'rm -rf "$bootstrap_dir"' EXIT
            archive="node-v24.22.1-linux-$arch.tar.gz"
            curl --proto '=https' --tlsv1.2 --fail --location --silent --show-error --retry 3 \
              --output "$bootstrap_dir/$archive" "https://nodejs.org/dist/v24.22.1/$archive"
            printf '%s  %s\n' "$checksum" "$bootstrap_dir/$archive" | sha256sum --check --strict
            tar -xzf "$bootstrap_dir/$archive" -C "$bootstrap_dir" --strip-components=1 \
              "node-v24.22.1-linux-$arch/bin/node"
            test "$("$bootstrap_dir/bin/node" --version)" = v24.22.1
            sudo -n install -m 0755 "$bootstrap_dir/bin/node" "$node"
            version="$("$node" --version)"
          fi
          if ! node_version_allowed "$version"; then
            echo "::error::The action runner uses Node.js $version; update its embedded runtime to Node.js 24.22.1 or newer on the 24.x line."
            exit 1
          fi
          "$node" --input-type=commonjs <<'NODE'
          const { X509Certificate, createHash } = require('node:crypto');
          const { rootCertificates } = require('node:tls');
          const distrusted = new Set([
            'bd153ed7b0434f6886b17bce8bbe84ed340c7132d702a8f4fa318f756ecbd6f3',
            'c619e4780ed8e0abeda24ad732567de4383a7ea941338f6d1a7d1b49ac792fe9',
            '8d417db2dd8bf5e3084d1e3f196d583849d81bdd4c00c70b9d39369e96b8c782',
          ]);
          for (const pem of rootCertificates) {
            const certificate = new X509Certificate(pem);
            const spki = certificate.publicKey.export({ type: 'spki', format: 'der' });
            if (distrusted.has(createHash('sha256').update(spki).digest('hex'))) {
              throw new Error(`The action runner still trusts an affected root: ${certificate.subject}`);
            }
          }
          console.log(`Action runtime Node.js ${process.versions.node}: security baseline and bundled roots verified.`);
          NODE
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Install native build dependencies
        run: |
          sudo apt-get update && sudo apt-get install -y ca-certificates openssl pkg-config libssl-dev libudev-dev libusb-1.0-0-dev protobuf-compiler libprotobuf-dev
          test -f /usr/include/google/protobuf/descriptor.proto
          dpkg --compare-versions "$(dpkg-query -W -f='${Version}' ca-certificates)" ge '20260816ubuntu0.24.04.1'
          sh scripts/check-ca-trust.sh tests/data/emudhra
      - name: Verify Protocol Buffers compiler
        run: protoc --version
      - name: Install Rust and LLVM coverage tools
        run: |
          rustup self update
          test "$(printf '%s\n' 1.29.2 "$(rustup --version | cut -d ' ' -f 2)" | sort -V | head -n 1)" = 1.29.2
          rustup toolchain install 1.99.1 --profile minimal --component llvm-tools-preview
          rustup override set 1.99.1
          cargo install cargo-llvm-cov --version 0.9.1 --locked
      - name: Install local EVM
        uses: foundry-rs/foundry-toolchain@dba66c27052e63476d886f22216e119ba7e615bf # v1.9.2
        with:
          version: v1.8.5
          cache: false
      - name: Run all targets and enforce 95 percent coverage
        run: ./scripts/test-coverage.sh
      - name: Check TLS dependency advisories
        run: |
          cargo install cargo-audit --version 0.22.2 --locked
          advisory_dir=$(mktemp -d)
          trap 'rm -rf "$advisory_dir"' EXIT
          git clone --depth 1 https://github.com/RustSec/advisory-db "$advisory_dir"
          git -C "$advisory_dir" log -1 --format='RustSec database: %H (%cI)'
          cargo audit --no-fetch --db "$advisory_dir" --json > target/dependency-audit.json || test "$?" -eq 1
          python3 scripts/check-tls-advisories.py target/dependency-audit.json
      - name: Upload coverage reports
        if: ${{ always() && steps.node_security.outcome == 'success' }}
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: coverage
          path: |
            target/coverage.json
            target/coverage/html
            target/dependency-audit.json
          if-no-files-found: ignore
